services:
  - type: web
    name: semantropic-trivia-alpha
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_WEB_MODEL
        value: gpt-6-luna
      - key: AI_MAX_BATCHES_PER_HOUR
        value: "12"
